; ============================================================
;  FLIPPER-ESP32  —  proyecto de la materia de programación
;  ESP32 clásico (WiFi + Bluetooth) + PN532 + 2x NRF24L01
;  + microSD + OLED
; ============================================================

[env:esp32dev]
platform = espressif32@6.6.0
board = esp32dev                 ; ESP32 clásico (DevKit 30/38 pines)
framework = arduino
board_build.partitions = huge_app.csv ; app de ~3 MB (para más módulos)

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit PN532
    adafruit/Adafruit BusIO
    nrf24/RF24
    olikraus/U8g2
    t-vk/ESP32 BLE Keyboard
    Arduino-IRremote/IRremote
    inanimate/Esp32Lua
